[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-knowledge-assistant"
version = "0.1.0"
description = "RAG system: hybrid retrieval (dense + BM25 + RRF), reranking, grounded answers with verified citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahesh Kadam" }]
dependencies = [
  "chromadb>=0.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Real neural models (heavy downloads) - the default offline backends need none of these.
ml = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.coverage.run]
source = ["src"]
