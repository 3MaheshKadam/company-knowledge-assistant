name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests eval

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + API tests with coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  eval:
    name: Retrieval quality gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run evaluation (fails if hybrid+rerank recall@4 < 0.90)
        run: |
          python -m eval.run_eval --min-recall 0.90 | tee eval-report.md
          { echo "## Evaluation results"; cat eval-report.md; } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker build + container smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: company-knowledge-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container (hardened flags, same as docker-compose)
        run: |
          docker run -d --name cka -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v cka-data:/data \
            -e RAG_API_KEYS=ci-test-key \
            company-knowledge-assistant:ci
      - name: Smoke test
        run: scripts/smoke_test.sh http://127.0.0.1:8000 ci-test-key data/raw/hr_leave_policy.md
      - name: Container health + non-root check
        run: |
          for i in $(seq 1 20); do
            s=$(docker inspect --format '{{.State.Health.Status}}' cka); [ "$s" = healthy ] && break; sleep 3
          done
          echo "health: $s"; [ "$s" = healthy ]
          [ "$(docker exec cka id -u)" = "10001" ]
      - name: Dump logs on failure
        if: failure()
        run: docker logs cka
